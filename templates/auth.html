<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shisela Nathi Lab — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<div class="page-wrapper">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <span>Shisela Nathi <em>Lab</em></span>
    </div>

    <!-- AUTH CARD -->
    <div class="auth-card">

        <!-- TAB SWITCHER -->
        <div class="tabs">
            <button class="tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tabSignUp" onclick="switchTab('signup')">Create Account</button>
            <div class="tab-slider" id="tabSlider"></div>
        </div>

        <!-- FLASH MESSAGE -->
        <div class="flash hidden" id="flash">
            <span id="flashMsg"></span>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signinForm" class="auth-form" onsubmit="handleSignIn(event)">
            <div class="field-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                    <input type="email" id="siEmail" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="field-group">
                <label>Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="siPassword" placeholder="Your password" required>
                    <button type="button" class="toggle-pw" onclick="togglePw('siPassword', this)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-footer">
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="submit-btn" id="signinBtn">
                <span>Sign In</span>
                <div class="btn-arrow">→</div>
            </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signupForm" class="auth-form hidden" onsubmit="handleSignUp(event)">
            <div class="field-group">
                <label>Username</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="suUsername" placeholder="Your name" required>
                </div>
            </div>
            <div class="field-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                    <input type="email" id="suEmail" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="field-row">
                <div class="field-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="suPassword" placeholder="Create password" required>
                        <button type="button" class="toggle-pw" onclick="togglePw('suPassword', this)">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field-group">
                    <label>Confirm Password</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="suConfirm" placeholder="Repeat password" required>
                    </div>
                </div>
            </div>
            <div class="terms-row">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="suTerms" required>
                    <span class="checkmark"></span>
                    <span class="terms-text">I agree to the <a href="#">Terms & Conditions</a></span>
                </label>
            </div>
            <button type="submit" class="submit-btn" id="signupBtn">
                <span>Create Account</span>
                <div class="btn-arrow">→</div>
            </button>
        </form>

    </div>

    <p class="page-foot">Welding Project Planner · Shisela Nathi Lab</p>

</div>

<script>
function switchTab(tab) {
    const isSignIn = tab === 'signin';
    document.getElementById('signinForm').classList.toggle('hidden', !isSignIn);
    document.getElementById('signupForm').classList.toggle('hidden', isSignIn);
    document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
    document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
    document.getElementById('tabSlider').style.transform = isSignIn ? 'translateX(0)' : 'translateX(100%)';
    hideFlash();
}

function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    btn.style.color = show ? 'var(--accent)' : 'var(--text-3)';
}

function showFlash(msg, type = 'error') {
    const el = document.getElementById('flash');
    el.className = `flash ${type}`;
    document.getElementById('flashMsg').textContent = msg;
}
function hideFlash() {
    document.getElementById('flash').className = 'flash hidden';
}

function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.style.opacity = loading ? '0.7' : '1';
    btn.querySelector('span').textContent = loading
        ? 'Please wait...'
        : (btnId === 'signinBtn' ? 'Sign In' : 'Create Account');
}

async function handleSignIn(e) {
    e.preventDefault();
    hideFlash();
    setLoading('signinBtn', true);
    try {
        const res  = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email:    document.getElementById('siEmail').value.trim(),
                password: document.getElementById('siPassword').value
            })
        });
        const data = await res.json();
        if (res.ok) {
            showFlash('Welcome back! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/', 1000);
        } else {
            showFlash(data.error || 'Invalid email or password.');
        }
    } catch { showFlash('Server error. Please try again.'); }
    finally  { setLoading('signinBtn', false); }
}

async function handleSignUp(e) {
    e.preventDefault();
    hideFlash();
    const password = document.getElementById('suPassword').value;
    const confirm  = document.getElementById('suConfirm').value;
    if (password !== confirm)  { showFlash('Passwords do not match.'); return; }
    if (password.length < 6)   { showFlash('Password must be at least 6 characters.'); return; }
    setLoading('signupBtn', true);
    try {
        const res  = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('suUsername').value.trim(),
                email:    document.getElementById('suEmail').value.trim(),
                password
            })
        });
        const data = await res.json();
        if (res.ok) {
            showFlash('Account created! Signing you in...', 'success');
            setTimeout(() => window.location.href = '/', 1000);
        } else {
            showFlash(data.error || 'Registration failed.');
        }
    } catch { showFlash('Server error. Please try again.'); }
    finally  { setLoading('signupBtn', false); }
}
</script>
</body>
</html>
